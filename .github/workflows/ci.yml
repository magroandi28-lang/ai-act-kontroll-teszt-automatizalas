name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Kod letoltese
        uses: actions/checkout@v4

      - name: JDK 21 beallitasa
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Tesztek futtatasa (Gmail es flaky kihagyva, virtualis kijelzovel)
        env:
          TEST_ALAP_URL:       ${{ secrets.TEST_ALAP_URL }}
          TEST_EMAIL:          ${{ secrets.TEST_EMAIL }}
          TEST_JELSZO:         ${{ secrets.TEST_JELSZO }}
          TEST_SZERVEZET_ID:   ${{ secrets.TEST_SZERVEZET_ID }}
          TEST_FELHASZNALO_ID: ${{ secrets.TEST_FELHASZNALO_ID }}
          SUPABASE_URL:        ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: xvfb-run -a mvn -B clean test -DexcludedGroups=gmail,flaky

      - name: Allure riport generalasa
        if: always()
        run: mvn allure:report

      - name: Titkos kulcs eltavolitasa a riportbol
        if: always()
        env:
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          grep -rl "$SUPABASE_SECRET_KEY" target/site 2>/dev/null | xargs -r sed -i "s|$SUPABASE_SECRET_KEY|***|g" || true

      - name: Riport publikalasa GitHub Pages-re
        if: always()
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: target/site/allure-maven-plugin